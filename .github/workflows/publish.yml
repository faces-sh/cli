name: Publish

# Publishes @faces-sh/cli to npm with provenance. Runs only when a release is
# published, from a `v*` tag (the npm environment allows nothing else), and only for a
# commit on main that the release gate passed. Each release opens a review issue in
# the gate; npm allows a clean unpublish for 72 hours.
on:
  release:
    types: [published]

permissions:
  contents: read
  statuses: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: The commit is on main and passed the release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cmp=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$cmp" in identical|behind) ;; *) echo "$GITHUB_SHA is not on main ($cmp)"; exit 1 ;; esac
          gate=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses?per_page=100" \
            --jq '[.[] | select(.context == "faces/rules" and .creator.login == "faces-release-gate[bot]")][0].state')
          [ "$gate" = success ] || { echo "faces/rules on $GITHUB_SHA is '${gate:-missing}'"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm run check
      # Trusted publishing: npm accepts this workflow, in the npm environment, and no token.
      - run: npm publish --provenance --access public
